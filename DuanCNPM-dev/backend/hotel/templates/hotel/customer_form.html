{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<h3 class="fw-bold mb-3">{{ title }}</h3>

<div class="card glass-card shadow-sm">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary mt-2">Lưu</button>
      <a href="{% url 'hotel:customer_list' %}" class="btn btn-secondary mt-2">Quay lại</a>
    </form>
  </div>
</div>
{% endblock %}
