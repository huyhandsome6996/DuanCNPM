{% extends 'base.html' %}
{% block title %}Gửi thông báo{% endblock %}

{% block content %}
<h3 class="fw-bold mb-3">🔔 Gửi thông báo cho nhân viên</h3>

<div class="card glass-card shadow-sm">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary">Gửi</button>
      <a href="{% url 'notifications:list' %}" class="btn btn-secondary">Quay lại</a>
    </form>
  </div>
</div>
{% endblock %}
