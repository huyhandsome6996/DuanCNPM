{% extends 'base.html' %}
{% block title %}Đăng nhập{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-70">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 glass-card">
            <div class="card-body p-4">
                <h3 class="text-center mb-3 fw-bold text-primary">Đăng nhập hệ thống</h3>
                <p class="text-center text-muted mb-4">
                    Vui lòng nhập tài khoản được cấp để truy cập.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tên đăng nhập</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mật khẩu</label>
                        {{ form.password }}
                    </div>
                    <button class="btn btn-primary w-100 py-2 fw-semibold">Đăng nhập</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
