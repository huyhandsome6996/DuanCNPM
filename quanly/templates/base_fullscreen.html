{% load static %}

<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Spring View{% endblock %}</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #295f48, #78b39e);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
      }

      .fullscreen-container {
        background: white;
        color: black;
        border-radius: 16px;
        padding: 40px;
        width: 95%;
        max-width: 700px;
        box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.3);
      }
    </style>

    {% block head %}{% endblock %}
  </head>
  <body>
    <div class="fullscreen-container">{% block content %} {% endblock %}</div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
