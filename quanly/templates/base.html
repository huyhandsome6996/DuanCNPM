{% load static %}

<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Quản lý khách sạn{% endblock %}</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Icon -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <style>
      body {
        background: #f5f6fa;
      }

      .sidebar {
        width: 260px;
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        background: #244f3d; /* xanh rừng SaPa */
        color: white;
        padding-top: 70px;
      }

      .sidebar a {
        color: #dfe6e9;
        text-decoration: none;
        display: block;
        padding: 12px 20px;
        font-size: 15px;
      }

      .sidebar a:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      .main-content {
        margin-left: 260px;
        padding: 20px;
      }

      .topbar {
        height: 60px;
        background: white;
        border-bottom: 1px solid #ddd;
        position: fixed;
        top: 0;
        left: 260px;
        right: 0;
        display: flex;
        align-items: center;
        padding: 0 20px;
        z-index: 1000;
      }
    </style>

    {% block head %}{% endblock %}
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <h4 class="text-center">🌿 Spring View</h4>

      <a href="{% url 'quanly:trang_chu' %}"
        ><i class="bi bi-house"></i> Trang chủ</a
      >
      <a href="{% url 'quanly:danh_sach_phong' %}"
        ><i class="bi bi-door-open"></i> Danh sách phòng</a
      >
      <a href="{% url 'quanly:danh_sach_dich_vu' %}"
        ><i class="bi bi-basket"></i> Dịch vụ</a
      >
      <a href="{% url 'quanly:dat_phong' %}"
        ><i class="bi bi-journal-plus"></i> Đặt phòng</a
      >

      <!-- Thêm menu sau -->
    </div>

    <!-- Topbar -->
    <div class="topbar">
      <strong>{% block page_title %}Quản lý khách sạn{% endblock %}</strong>
    </div>

    <!-- Main content -->
    <div class="main-content" style="margin-top: 70px">
      {% block content %}
      <!-- Nội dung trang sẽ xuất hiện tại đây -->
      {% endblock %}
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
